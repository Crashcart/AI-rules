name: Sync Fork with Upstream (PR-Based)

# PR-based upstream sync for forks that have custom additions (modules).
# Instead of auto-merging, opens a pull request so you can review conflicts
# before merging — protects custom modules listed in FORK_MODULES.md.
#
# Use this workflow (instead of upstream-sync.yml) when:
#   - Your fork has files listed in FORK_MODULES.md with Medium or High conflict risk
#   - You want to review upstream changes before they land in your branch
#   - You have CI that must pass before merging
#
# Setup:
#   1. Copy this file to .github/workflows/upstream-sync-pr.yml in your fork repo.
#   2. Set UPSTREAM_URL as a repository variable (Settings → Variables → Actions):
#      e.g. https://github.com/original-owner/original-repo
#   3. No secrets needed — GITHUB_TOKEN is sufficient.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  sync-pr:
    name: Open upstream sync PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream "${{ vars.UPSTREAM_URL }}"

      - name: Fetch upstream
        run: git fetch upstream

      - name: Detect upstream default branch
        id: upstream_branch
        run: |
          branch=$(git remote show upstream | awk '/HEAD branch/ {print $NF}')
          echo "branch=${branch:-main}" >> "$GITHUB_OUTPUT"

      - name: Count commits behind
        id: behind
        run: |
          count=$(git rev-list "HEAD..upstream/${{ steps.upstream_branch.outputs.branch }}" --count)
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Skip if already up to date
        if: steps.behind.outputs.count == '0'
        run: |
          echo "Fork is up to date with upstream. No PR needed."
          exit 0

      - name: Create sync branch
        run: |
          DATE=$(date +%Y%m%d)
          BRANCH="sync/upstream-${DATE}"
          git checkout -b "${BRANCH}"
          git merge "upstream/${{ steps.upstream_branch.outputs.branch }}" \
            --no-edit \
            -m "sync: merge upstream changes $(date +%Y-%m-%d)"
          git push origin "${BRANCH}"
          echo "SYNC_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Read fork modules manifest
        id: modules
        run: |
          if [ -f FORK_MODULES.md ]; then
            echo "manifest_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List changed files
        id: changed
        run: |
          FILES=$(git diff --name-only "origin/main..${SYNC_BRANCH}" | head -20 | tr '\n' ' ')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        run: |
          BEHIND="${{ steps.behind.outputs.count }}"
          BRANCH="${{ steps.upstream_branch.outputs.branch }}"
          MANIFEST_NOTE=""
          if [ "${{ steps.modules.outputs.manifest_exists }}" = "true" ]; then
            MANIFEST_NOTE="**Custom module manifest found** (\`FORK_MODULES.md\`). Review changed files against the manifest before merging — files with Medium or High conflict risk need manual review."
          else
            MANIFEST_NOTE="No \`FORK_MODULES.md\` found. Consider adding one to track your custom additions."
          fi

          gh pr create \
            --base main \
            --head "${SYNC_BRANCH}" \
            --title "sync: upstream changes $(date +%Y-%m-%d) (${BEHIND} commit(s))" \
            --body "## Upstream Sync — $(date +%Y-%m-%d)

Upstream is **${BEHIND} commit(s) ahead** of this fork on branch \`${BRANCH}\`.

${MANIFEST_NOTE}

### Changed files (first 20)
\`\`\`
${{ steps.changed.outputs.files }}
\`\`\`

### Before merging
- [ ] Review changed files against \`FORK_MODULES.md\` custom additions
- [ ] Confirm CI passes
- [ ] Check that no upstream changes overwrite fork-specific config

_Generated by upstream-sync-pr.yml_"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

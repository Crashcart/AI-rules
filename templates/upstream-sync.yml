name: Sync Fork with Upstream

# Syncs this fork's main branch with its upstream source repo daily.
# Uses GITHUB_TOKEN — no PAT or additional secrets required.
# On merge conflict, the step fails and GitHub notifies the repo owner.
#
# Setup:
#   Copy this file to .github/workflows/upstream-sync.yml in your fork repo.
#   No other configuration needed.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  sync:
    name: Sync fork branch with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        run: gh api repos/${{ github.repository }}/merge-upstream -f branch=main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

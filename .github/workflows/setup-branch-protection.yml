name: Setup Branch Protection (run once)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-branch-protection.yml'
  workflow_dispatch:

permissions:
  administration: write
  contents: read

jobs:
  protect-main:
    name: Enable branch protection on main
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection via REST API
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main/protection" \
            -d '{"required_status_checks":{"strict":false,"contexts":["Block rule changes from fork PRs"]},"enforce_admins":true,"required_pull_request_reviews":{"require_code_owner_reviews":true,"required_approving_review_count":1,"dismiss_stale_reviews":false},"restrictions":null}')
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Branch protection API returned $HTTP_STATUS"
            exit 1
          fi
          echo "Branch protection applied successfully."

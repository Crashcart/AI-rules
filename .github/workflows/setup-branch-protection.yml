name: Setup Branch Protection (run once)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-branch-protection.yml'
  workflow_dispatch:

permissions:
  administration: write
  contents: read

jobs:
  protect-main:
    name: Enable branch protection on main
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection rules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/branches/main/protection \
            --input - <<'EOF'
          {
            "required_status_checks": {
              "strict": false,
              "contexts": ["Block rule changes from fork PRs"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "require_code_owner_reviews": true,
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": false
            },
            "restrictions": null
          }
          EOF
      - name: Verify protection is active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROTECTED=$(gh api /repos/${{ github.repository }}/branches/main --jq '.protected')
          echo "main protected: $PROTECTED"
          [ "$PROTECTED" = "true" ] && echo "SUCCESS: Branch protection is active." || echo "WARNING: Protection may not have applied."

name: Setup Branch Protection (run once)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-branch-protection.yml'
  workflow_dispatch:

permissions:
  administration: write
  contents: read

jobs:
  protect-main:
    name: Enable branch protection on main
    runs-on: ubuntu-latest
    steps:
      - name: Enable branch protection via GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Step 1: Get repository node ID..."
          REPO_ID=$(gh api graphql \
            -f query='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){id}}' \
            -f owner="${{ github.repository_owner }}" \
            -f repo="${{ github.event.repository.name }}" \
            --jq '.data.repository.id')
          echo "Repository ID: $REPO_ID"

          echo "Step 2: Create branch protection rule..."
          RESULT=$(gh api graphql \
            -f query='mutation($repoId:ID!,$pattern:String!){createBranchProtectionRule(input:{repositoryId:$repoId,pattern:$pattern,requiresApprovingReviews:true,requiredApprovingReviewCount:1,requiresCodeOwnerReviews:true,isAdminEnforced:false,dismissesStaleReviews:false}){branchProtectionRule{id,pattern,requiresApprovingReviews}}}' \
            -f repoId="$REPO_ID" \
            -f pattern="main")
          echo "GraphQL response: $RESULT"

          # Check for errors in response
          if echo "$RESULT" | grep -q '"errors"'; then
            echo "ERROR: GraphQL mutation failed"
            echo "$RESULT"
            exit 1
          fi

          RULE_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['createBranchProtectionRule']['branchProtectionRule']['id'])" 2>/dev/null || echo "")
          if [ -n "$RULE_ID" ]; then
            echo "Branch protection rule created successfully. Rule ID: $RULE_ID"
          else
            echo "Unexpected response format — check output above"
            exit 1
          fi

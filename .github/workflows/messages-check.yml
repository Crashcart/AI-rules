name: PM Message Check (4×/day)

# Scans messages/inbox/ for pending PM rule-suggestions and hire-requests.
# Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC = 4×/day) and on demand.
# If anything is pending, opens or updates a single GitHub issue that alerts the user.
# It only ALERTS — it never approves, edits a rule, or creates a role (RULE 16 / RULE 17).

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'   # every 6 hours = 4 times a day
  workflow_dispatch:              # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - 'messages/inbox/**'

jobs:
  check:
    name: Alert on pending PM messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan inbox
        id: scan
        run: |
          if bash scripts/check-messages.sh --markdown > /tmp/msg-body.md; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure pending-approval label exists
        if: steps.scan.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create pending-approval \
            --color "#d93f0b" \
            --description "PM message awaiting user approval (rule change or hire)" \
            --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Open or update alert issue
        if: steps.scan.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚑ PM messages awaiting your approval"
          BODY="$(cat /tmp/msg-body.md)

          ---
          _Auto-generated by the PM message check (4×/day). Reviewed: $(date -u '+%Y-%m-%d %H:%M UTC'). This alert never approves anything — you decide._"

          # Find an existing open alert issue (by exact title) and update it; else create one.
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label pending-approval \
            --state open \
            --search "in:title $TITLE" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
            echo "Updated alert issue #$EXISTING"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --label pending-approval \
              --body "$BODY"
            echo "Created new alert issue"
          fi

      - name: Close stale alert if inbox is now clear
        if: steps.scan.outputs.pending == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚑ PM messages awaiting your approval"
          STALE=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label pending-approval \
            --state open \
            --search "in:title $TITLE" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$STALE" ]; then
            gh issue comment "$STALE" --repo "${{ github.repository }}" \
              --body "Inbox is now clear — all PM messages have been processed. Closing."
            gh issue close "$STALE" --repo "${{ github.repository }}" --reason completed
            echo "Closed stale alert issue #$STALE"
          fi

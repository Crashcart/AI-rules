repository:
  name: AI-rules
  private: false

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        require_code_owner_reviews: true
        dismiss_stale_reviews: false
      required_status_checks:
        strict: false
        contexts:
          - "Block rule changes from fork PRs"
      enforce_admins: true
      restrictions: null
